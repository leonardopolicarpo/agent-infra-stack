[project]
name = "agent-infra-stack"
version = "0.2.0"
description = "Scalable multi-agent pipeline with persistent memory, async task queue and local LLM inference"
readme = "README.md"
requires-python = ">=3.10.13"
dependencies = [
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.1.10",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "uvicorn>=0.46.0",
]
